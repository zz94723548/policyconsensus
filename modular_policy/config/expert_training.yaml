defaults:
  - _self_
  - perception
  - task: rlbench/mt4_expert_split

_target_: modular_policy.workspace.train_modality_expert.TrainModalityExpertWorkspace
data_split_manifest: splits/mt4_seed42.json
shape_meta: ${task.shape_meta}
horizon: 16
n_obs_steps: 2
n_action_steps: 8

policy:
  _target_: modular_policy.policy.dp_unet.DiffusionUnetPolicy
  shape_meta: ${shape_meta}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  num_inference_steps: 100
  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

ema:
  _target_: modular_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 32
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: false
val_dataloader:
  batch_size: 32
  num_workers: 4
  shuffle: false
  pin_memory: true
  persistent_workers: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: cuda:0
  seed: 42
  validation_seed: 1042
  resume: false
  num_epochs: 1000
  lr_scheduler: cosine
  lr_warmup_steps: 500
  gradient_accumulate_every: 1
  use_ema: true
  val_every: 5
  checkpoint_every: 5
  max_train_steps: null
  max_val_steps: null

logging:
  project: rgb_pcd_experts
  mode: offline
  name: ${expert_modality}_seed${training.seed}
  id: null
  resume: false

hydra:
  job:
    chdir: false
  run:
    dir: output/experts/${expert_modality}_seed${training.seed}
